<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravity Card Bikeparks</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gravity">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f5f5f7;--panel:rgba(255,255,255,.94);--card:#fff;--line:#e5e5ea;--fg:#1d1d1f;--mut:#6e6e73;--open:#f47721;--seen:#218653;--route:#0878f9;--shadow:0 8px 28px rgba(0,0,0,.07);color-scheme:light}
:root[data-theme="dark"]{--bg:#101114;--panel:rgba(25,26,30,.96);--card:#202126;--line:#34353b;--fg:#f5f5f7;--mut:#a1a1a8;--open:#ff8a3d;--seen:#48d597;--route:#58a6ff;--shadow:0 8px 28px rgba(0,0,0,.22);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em}
#app{display:grid;grid-template-columns:minmax(340px,420px) 1fr;height:100%;height:100dvh;gap:0}#side{padding-left:env(safe-area-inset-left);background:var(--panel);backdrop-filter:blur(18px);overflow-y:auto;border-right:1px solid var(--line);z-index:2}#map{height:100%;background:#e8e4dc}.leaflet-container{font:inherit}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--fg);border-radius:16px}.leaflet-popup-content{margin:14px 16px}.leaflet-container a.leaflet-popup-close-button{color:var(--mut)}
header{padding:22px 22px 16px;position:sticky;top:0;background:var(--panel);backdrop-filter:blur(18px);z-index:5;border-bottom:1px solid var(--line)}.headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}h1{margin:0;font-size:23px;letter-spacing:-.8px;font-weight:750}h1 span{color:var(--open)}.sub{color:var(--mut);font-size:12px;margin-top:3px}.themebtn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:12px;white-space:nowrap}.bar{height:6px;background:var(--line);border-radius:99px;margin-top:15px;overflow:hidden}.bar div{height:100%;width:0;background:var(--seen);border-radius:99px;transition:width .3s}.cnt{font-size:12px;margin-top:7px;color:var(--mut)}.cnt b{color:var(--fg)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px}.stat strong{display:block;font-size:19px;letter-spacing:-.5px}.stat span{font-size:11px;color:var(--mut)}
.sec{padding:14px 18px 0}.route{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.route h2{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut)}.stop{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}.num{width:22px;height:22px;border-radius:50%;background:var(--route);color:white;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}.stop .x{margin-left:auto;cursor:pointer;color:var(--mut);padding:0 4px}.orderbtn{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:6px;padding:1px 5px;cursor:pointer}.go{display:block;text-align:center;margin-top:10px;padding:11px;border-radius:11px;background:var(--route);color:white;font-weight:650;text-decoration:none}.go.off{background:var(--line);color:var(--mut);pointer-events:none}.clear{background:none;border:0;color:var(--mut);cursor:pointer;margin-top:8px;font-size:12px}.routeinfo{font-size:12px;color:var(--mut);margin-top:9px;line-height:1.5}.routeinfo strong{color:var(--fg)}
.tools{display:flex;gap:7px;flex-wrap:wrap;padding:14px 18px 10px}.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 12px;border-radius:99px;cursor:pointer;font-size:12px}.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}#q{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);color:var(--fg);padding:7px 13px;border-radius:99px;font-size:14px;outline:none}#q:focus{border-color:var(--route)}
.park-detail{margin:0 18px 12px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.detail-head h2{font-size:19px;line-height:1.25;margin:0}.close-detail{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:9px;width:34px;height:34px;font-size:19px;cursor:pointer;flex:none}.detail-actions{margin:12px 0;display:flex;gap:7px;flex-wrap:wrap}.park-detail .trail-list{font-size:13px}.park-detail .trail-row{padding:7px 0;border-bottom:1px solid var(--line)}.item{margin:0 18px 8px;padding:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .15s,transform .15s}.item:hover{border-color:var(--mut);transform:translateY(-1px)}.item.seen{border-left:3px solid var(--seen)}.item.open{border-left:3px solid var(--open)}.name{font-weight:650;font-size:14px}.meta{color:var(--mut);font-size:12px;margin:3px 0 10px}.btns{display:flex;gap:6px;flex-wrap:wrap}.b{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.b.on-seen{background:var(--seen);color:#06210f;border-color:var(--seen)}.b.on-route{background:var(--route);color:white;border-color:var(--route)}.pad{height:calc(20px + env(safe-area-inset-bottom))}.pin{width:30px;height:30px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.28)}.pin.open{background:var(--open)}.pin.seen{background:var(--seen);color:#06210f}.pin.sel{background:var(--route);color:#fff;transform:scale(1.15)}.pop b{font-size:15px}.pop .meta{margin-bottom:10px}.leg{margin:3px 0 4px 30px;font-size:11px;color:var(--mut)}.wx{margin-top:10px;font-size:12px}.days{display:flex;gap:12px;margin-top:6px;text-align:center;font-size:11px}.days div div{white-space:nowrap}.pop .mut{font-size:12px;color:var(--mut);margin:6px 0}.pop a{color:var(--route)}.trail-list{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;font-size:12px}.trail-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0}.trail-row span:last-child{color:var(--mut);white-space:nowrap}.trail-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:42% 58%}#map{order:-1}#side{border-right:0;border-top:1px solid var(--line)}header{padding-top:14px}.stats{margin-top:10px}.sec{padding-top:10px}}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <div class="headrow"><div><h1>Gravity <span>Card</span></h1><div class="sub">Bikepark Explorer · Saison 2026</div></div><button class="themebtn" id="themeBtn" type="button">Darstellung wechseln</button></div>
      <div class="stats"><div class="stat"><strong id="statSeen">0</strong><span>Besucht</span></div><div class="stat"><strong id="statLeft">31</strong><span>Noch offen</span></div><div class="stat"><strong id="statCountries">0</strong><span>Länder</span></div></div>
      <div class="bar"><div id="prog"></div></div>
      <div class="cnt" id="cnt"></div>
    </header>
    <div class="sec"><div class="route" id="route"></div></div>
    <div class="tools">
      <button class="chip on" data-f="all">Alle</button>
      <button class="chip" data-f="seen">Besucht</button>
      <button class="chip" data-f="open">Offen</button>
      <input id="q" placeholder="Bikepark suchen…">
    </div>
    <div id="list"></div>
    <div class="pad"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Name, Land, Breite, Länge, Seite auf gravity-card.com (zugleich der Schlüssel zum Speichern)
const P=[
["Epic Bikepark Leogang","AT",47.428,12.733,"epic-bikepark-leogang"],
["Saalbach Hinterglemm","AT",47.391,12.637,"saalbach-hinterglemm"],
["Bikepark Serfaus-Fiss-Ladis","AT",47.040,10.610,"bikepark-serfaus-fiss-ladis"],
["Bikeland Schladming-Dachstein","AT",47.394,13.685,"schladming-dachstein"],
["Bike Kingdom Lenzerheide","CH",46.729,9.556,"bike-kindom-park-lenzerheide"],
["Bikepark Brandnertal","AT",47.087,9.734,"bikepark-brandnertal"],
["Bike Republic Sölden","AT",46.966,11.007,"bike-republic-soelden"],
["3 Länder Enduro Trails","AT",46.889,10.500,"3-laender-enduro-trails"],
["Bad Kleinkirchheim Flow Country Trail","AT",46.814,13.804,"bad-kleinkirchheimer-flow-country-trail"],
["Biketrails Flims Laax","CH",46.810,9.260,"biketrails-flims-laax"],
["Bikepark Innsbruck","AT",47.226,11.393,"bikepark-innsbruck"],
["The Mother – Bikepark Winterberg","DE",51.190,8.536,"bikepark-winterberg"],
["MTB Zone Bikepark Geisskopf","DE",48.983,13.183,"mtb-zone-bikepark-geisskopf"],
["Bikepark Špičák","CZ",49.176,13.291,"bikepark-spicak"],
["Bikepark Semmering","AT",47.635,15.828,"bikepark-semmering"],
["MTB Zone Bikepark Willingen","DE",51.298,8.605,"mtb-zone-bikepark-willingen"],
["MTB Zone Bikepark Petzen","AT",46.519,14.790,"mtb-zone-bikepark-petzen"],
["Bike Park Pohorje Maribor","SI",46.533,15.599,"maribor-bike-park"],
["360° Flow Trails Kitzbühel Kirchberg","AT",47.446,12.392,"flowtrails-kitz-kirchberg"],
["Bikepark Lienz","AT",46.830,12.800,"bikepark-lienz"],
["Paganella Bike Park","IT",46.150,11.056,"paganella-bike"],
["Szczyrk Bike Park by Trek","PL",49.710,19.030,"bike-park-szczyrk"],
["Bikepark Kronplatz","IT",46.740,11.954,"bikepark-kronplatz"],
["Val di Sole Bikepark","IT",46.330,10.850,"val-di-sole-bikepark"],
["Wexl Trails","AT",47.615,16.010,"wexl-trails"],
["Bike Beats Alta Badia","IT",46.551,11.876,"bike-beats-alta-badia"],
["Silvretta Bike Arena Ischgl/Samnaun","AT",46.969,10.292,"silvretta-bike-arena-ischgl-samnaun"],
["Bikepark Lermoos-Biberwier","AT",47.395,10.878,"bikepark-lermoos-biberwier"],
["Mottolino Bikepark Livigno","IT",46.538,10.136,"mottolino-bikepark"],
["Trailarea Turracher Höhe","AT",46.915,13.880,"trailarea-turracher-hoehe"],
["Bike District Val di Fassa","IT",46.477,11.771,"bike-district-val-di-fassa"],
["Trailpark Klínovec","CZ",50.393,12.970,"trailpark-klinovec"]
];
const FLAG={AT:"🇦🇹",CH:"🇨🇭",DE:"🇩🇪",CZ:"🇨🇿",SI:"🇸🇮",IT:"🇮🇹",PL:"🇵🇱"};
const MAX=5;
const ROUTING_URL="https://router.project-osrm.org/route/v1/driving/";
let routeInfo=null, routeLoading=false, routeError="", routeSeq=0;

let seen={}, sel=[], filter="all", query="";
try{
  seen=JSON.parse(localStorage.getItem("gc_seen")||"{}");
  sel=JSON.parse(localStorage.getItem("gc_sel")||"[]");
}catch(e){ seen={}; sel=[]; }

function save(){
  try{
    localStorage.setItem("gc_seen",JSON.stringify(seen));
    localStorage.setItem("gc_sel",JSON.stringify(sel));
  }catch(e){}
}

// Karte mit OpenStreetMap
const map=L.map("map").setView([47.3,11.5],6);
// Kartenstile ohne API-Key. Oben rechts umschaltbar.
const strassen=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{
  maxZoom:19,
  attribution:"Tiles © Esri"
});
const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,
  attribution:"© OpenStreetMap-Mitwirkende"
});
const gelaende=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",{
  maxZoom:19,
  attribution:"Tiles © Esri"
});
const satellit=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{
  maxZoom:19,
  attribution:"Tiles © Esri"
});
strassen.addTo(map);
L.control.layers({"Straßen":strassen,"OpenStreetMap":osm,"Gelände":gelaende,"Satellit":satellit}).addTo(map);

const markers=[];
let activePark=null;
const line=L.polyline([],{color:"#8b93a3",weight:2,dashArray:"4 7",opacity:.7}).addTo(map);
const roadLine=L.geoJSON(null,{style:{color:"#0878f9",weight:5,opacity:.9}}).addTo(map);

function url(i){ return "https://www.gravity-card.com/bikeparks/"+P[i][4]+"/?lang=en"; }
function isSeen(i){ return seen[P[i][4]]===true; }

function icon(i){
  const k=sel.indexOf(i);
  let cls="pin "+(isSeen(i)?"seen":"open");
  let txt=isSeen(i)?"✓":"";
  if(k>=0){ cls="pin sel"; txt=String(k+1); }
  return L.divIcon({className:"",html:'<div class="'+cls+'">'+txt+"</div>",iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-18]});
}

// Wetter von Open-Meteo (gratis, ohne Key)
const W={};
function wIcon(c){
  if(c===0){ return "☀️"; }
  if(c<=2){ return "🌤️"; }
  if(c===3){ return "☁️"; }
  if(c<=48){ return "🌫️"; }
  if(c<=57){ return "🌦️"; }
  if(c<=67){ return "🌧️"; }
  if(c<=77){ return "❄️"; }
  if(c<=82){ return "🌧️"; }
  if(c<=86){ return "🌨️"; }
  return "⛈️";
}
function wHtml(i){
  const w=W[i];
  if(!w){ return '<div class="mut">Wetter lädt…</div>'; }
  if(w==="err"){ return '<div class="mut">Wetter nicht verfügbar</div>'; }
  const tage=["So","Mo","Di","Mi","Do","Fr","Sa"];
  let h='<div class="wx"><b>Jetzt '+Math.round(w.current.temperature_2m)+'° '+wIcon(w.current.weather_code)+'</b> · Wind '+Math.round(w.current.wind_speed_10m)+' km/h<div class="days">';
  for(let k=0;k<3;k++){
    const d=new Date(w.daily.time[k]);
    h+='<div><div>'+(k===0?"Heute":tage[d.getDay()])+'</div><div>'+wIcon(w.daily.weather_code[k])+'</div><div>'
      +Math.round(w.daily.temperature_2m_max[k])+'°/'+Math.round(w.daily.temperature_2m_min[k])+'°</div><div>'
      +Math.round(w.daily.precipitation_sum[k])+' mm</div></div>';
  }
  return h+"</div></div>";
}
function loadWeather(i){
  if(W[i]){ return; }
  const u="https://api.open-meteo.com/v1/forecast?latitude="+P[i][2]+"&longitude="+P[i][3]
    +"&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&forecast_days=3";
  fetch(u).then(function(r){ return r.json(); }).then(function(j){
    W[i]=j; draw(); if(markers[i].isPopupOpen()) markers[i].setPopupContent(popup(i));
  }).catch(function(){
    W[i]="err"; draw(); if(markers[i].isPopupOpen()) markers[i].setPopupContent(popup(i));
  });
}

function popup(i){
  return '<div class="pop"><b>'+P[i][0]+'</b><div class="meta">'+FLAG[P[i][1]]+" "+P[i][1]+'</div>'
    +'<div class="btns">'
    +'<button class="b'+(isSeen(i)?" on-seen":"")+'" onclick="toggleSeen('+i+')">✓ war da</button>'
    +'<button class="b'+(sel.indexOf(i)>=0?" on-route":"")+'" onclick="toggleSel('+i+')">+ Route</button>'
    +'<a class="b" href="'+url(i)+'" target="_blank" rel="noopener">Website ↗</a>'
    +"</div>"
    +trailHtml(i)
    +wHtml(i)
    +"</div>";
}

for(let i=0;i<P.length;i++){
  const m=L.marker([P[i][2],P[i][3]],{icon:icon(i)}).on("click",()=>focusPark(i));
  markers.push(m);
}

function toggleSeen(i){
  seen[P[i][4]]=!isSeen(i);
  save(); draw();
}
function toggleSel(i){
  const k=sel.indexOf(i);
  if(k>=0){ sel.splice(k,1); }
  else if(sel.length<MAX){ sel.push(i); }
  else { alert("Maximal "+MAX+" Parks für die Route."); }
  save(); calculateRoadRoute();
}
function km(a,b){
  const r=Math.PI/180;
  const dLat=(P[b][2]-P[a][2])*r, dLon=(P[b][3]-P[a][3])*r;
  const x=Math.pow(Math.sin(dLat/2),2)+Math.cos(P[a][2]*r)*Math.cos(P[b][2]*r)*Math.pow(Math.sin(dLon/2),2);
  return 2*6371*Math.asin(Math.sqrt(x));
}
function fahrt(k){
  const min=Math.round(k*1.3/70*60);
  return Math.floor(min/60)+" h "+(min%60)+" min";
}
function durationText(seconds){
  const min=Math.round(seconds/60), h=Math.floor(min/60), m=min%60;
  return h>0 ? h+" h "+m+" min" : m+" min";
}
async function calculateRoadRoute(){
  const seq=++routeSeq; routeInfo=null; routeError=""; routeLoading=sel.length>=2;
  roadLine.clearLayers();
  if(sel.length<2){routeLoading=false;draw();return;}
  draw();
  const coords=sel.map(i=>P[i][3]+","+P[i][2]).join(";");
  try{
    const res=await fetch(ROUTING_URL+coords+"?overview=full&geometries=geojson&steps=false",{headers:{"Accept":"application/json"}});
    if(!res.ok) throw new Error("Routing-Dienst antwortet nicht (HTTP "+res.status+")");
    const data=await res.json();
    if(data.code!=="Ok"||!data.routes||!data.routes[0]) throw new Error("Für diese Stopps wurde keine Straßenroute gefunden.");
    if(seq!==routeSeq)return;
    routeInfo={distance:data.routes[0].distance/1000,duration:data.routes[0].duration,legs:data.routes[0].legs||[],geometry:data.routes[0].geometry};
    roadLine.addData({type:"Feature",properties:{},geometry:routeInfo.geometry});
    if(routeInfo.geometry&&routeInfo.geometry.coordinates.length>1){map.fitBounds(roadLine.getBounds(),{padding:[35,35],maxZoom:8});}
  }catch(e){if(seq===routeSeq)routeError=e.message||"Straßenroute nicht verfügbar.";}
  if(seq===routeSeq){routeLoading=false;draw();}
}
function perms(a){
  if(a.length<=1){ return [a]; }
  const out=[];
  for(let k=0;k<a.length;k++){
    const rest=a.slice(0,k).concat(a.slice(k+1));
    const sub=perms(rest);
    for(let j=0;j<sub.length;j++){ out.push([a[k]].concat(sub[j])); }
  }
  return out;
}
function pathLen(o){
  let t=0;
  for(let k=1;k<o.length;k++){ t+=km(o[k-1],o[k]); }
  return t;
}
function bestOrder(){
  let best=sel, bestLen=pathLen(sel);
  const all=perms(sel);
  for(let j=0;j<all.length;j++){
    const l=pathLen(all[j]);
    if(l<bestLen){ best=all[j]; bestLen=l; }
  }
  sel=best; save(); calculateRoadRoute();
}
function removeStop(k){ sel.splice(k,1); save(); calculateRoadRoute(); }
function moveStop(k,delta){const j=k+delta;if(j<0||j>=sel.length)return;const t=sel[k];sel[k]=sel[j];sel[j]=t;save();calculateRoadRoute();}
function clearRoute(){ sel=[]; save(); calculateRoadRoute(); }

// Offizielle Trail-Listen. Nur Namen und Schwierigkeitsfarben anzeigen;
// keine OSM-Abfragen oder erfundenen Streckenverläufe.
const OFFICIAL_TRAILS={
  "epic-bikepark-leogang":[
    ["Steinberg Line by FOX","blue"],["Hangman II","blue"],["Flow Link by FOX","red"],["Hangman I","red"],["Flying Gangster","red"],["T-LINE by GoPro","red"],["Hot Shots fired by GoPro","black"],["Speedster","black"],["Antonius Trail","black"],["Bongo Bongo","black"],["Vali's Hölle","black"],["Hangover","black"]
  ],
  "saalbach-hinterglemm":[["Monti Trail","blue"],["Hacklberg Trail","blue"],["Panorama Trail","blue"],["Z-Line","red"],["X-Line","black"],["Pro Line","black"]],

function trailHtml(i){
  const trails=OFFICIAL_TRAILS[P[i][4]];
  if(!trails)return '<div class="trail-list"><div class="mut">Für diesen Park sind noch keine verlässlichen Trail-Daten hinterlegt.</div></div>';
  const colors={blue:'#1688e8',red:'#ef4444',black:'#222'};
  let h='<div class="trail-list"><b>Trails</b>';
  trails.forEach(t=>{h+='<div class="trail-row"><span><i class="dot" style="background:'+colors[t[1]]+'"></i>'+escapeHtml(t[0])+'</span><span>'+({blue:'Blau',red:'Rot',black:'Schwarz'}[t[1]])+'</span></div>';});
  h+='<div class="trail-legend"><span><i class="dot" style="background:'+colors.blue+'"></i>Blau</span><span><i class="dot" style="background:'+colors.red+'"></i>Rot</span><span><i class="dot" style="background:'+colors.black+'"></i>Schwarz</span></div></div>';
  return h;
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function focusPark(i){
  activePark=i;
  document.getElementById("side").scrollTop=0;
  if(!map.hasLayer(markers[i])){ markers[i].addTo(map); }
  map.flyTo([P[i][2],P[i][3]],11);
  loadWeather(i);
  draw();
}
function closeParkDetail(){
  activePark=null;
  document.getElementById("side").scrollTop=0;
  draw();
}

function show(i){
  if(filter==="seen" && !isSeen(i)){ return false; }
  if(filter==="open" && isSeen(i)){ return false; }
  if(query && P[i][0].toLowerCase().indexOf(query)<0){ return false; }
  return true;
}

function routeUrl(){
  const c=sel.map(i=>P[i][2]+","+P[i][3]);
  let u="https://www.google.com/maps/dir/?api=1&travelmode=driving&origin="+c[0]+"&destination="+c[c.length-1];
  if(c.length>2){ u+="&waypoints="+c.slice(1,-1).join("%7C"); }
  return u;
}

function draw(){
  // Fortschritt
  let n=0;
  for(let i=0;i<P.length;i++){ if(isSeen(i)){ n++; } }
  document.getElementById("prog").style.width=(n/P.length*100)+"%";
  document.getElementById("cnt").innerHTML="<b>"+n+"</b> von "+P.length+" Parks besucht";
  document.getElementById("statSeen").textContent=n;
  document.getElementById("statLeft").textContent=P.length-n;
  document.getElementById("statCountries").textContent=new Set(P.filter((p,i)=>isSeen(i)).map(p=>p[1])).size;

  // Marker
  for(let i=0;i<P.length;i++){
    markers[i].setIcon(icon(i));
    if(show(i)){ if(!map.hasLayer(markers[i])){ markers[i].addTo(map); } }
    else { map.removeLayer(markers[i]); }
    if(markers[i].isPopupOpen()){ markers[i].setPopupContent(popup(i)); }
  }
  line.setLatLngs(sel.map(i=>[P[i][2],P[i][3]]));

  // Route-Box
  let r="<h2>Route · "+sel.length+" / "+MAX+"</h2>";
  if(sel.length===0){ r+='<div class="sub">Wähle bis zu 5 Parks mit „+ Route“ aus.</div>'; }
  let total=0;
  for(let k=0;k<sel.length;k++){
    if(k>0){
      const d=km(sel[k-1],sel[k]); total+=d;
      r+='<div class="leg">↓ '+Math.round(d)+' km Luftlinie</div>';
    }
    r+='<div class="stop"><div class="num">'+(k+1)+"</div>"+P[sel[k]][0]+(k>0?'<button class="orderbtn" title="Nach oben" onclick="moveStop('+k+',-1)">↑</button>':'')+(k<sel.length-1?'<button class="orderbtn" title="Nach unten" onclick="moveStop('+k+',1)">↓</button>':'')+'<span class="x" onclick="removeStop('+k+')">✕</span></div>';
  }
  if(sel.length>=2){
    if(routeLoading){r+='<div class="routeinfo">Straßenroute wird berechnet…</div>';}
    else if(routeInfo){
      r+='<div class="routeinfo"><strong>'+routeInfo.distance.toFixed(1)+' km Straße</strong> · ca. '+durationText(routeInfo.duration)+'<br>Die Angaben stammen vom OSRM-Straßenrouting.</div>';
      for(let j=0;j<routeInfo.legs.length;j++){const leg=routeInfo.legs[j];r+='<div class="leg">Etappe '+(j+1)+': '+(leg.distance/1000).toFixed(1)+' km · '+durationText(leg.duration)+'</div>';}
    } else {r+='<div class="routeinfo">'+(routeError||'Straßenroute noch nicht berechnet.')+'<br><button class="b" style="margin-top:6px" onclick="calculateRoadRoute()">Erneut berechnen</button></div>';}
    r+='<div class="routeinfo">Zusätzlich: '+Math.round(total)+' km Luftlinie</div>';
  }
  if(sel.length>=3){ r+='<button class="b" style="margin-top:8px" onclick="bestOrder()">Reihenfolge nach Luftlinie optimieren</button>'; }
  if(sel.length>=2){ r+='<a class="go" href="'+routeUrl()+'" target="_blank" rel="noopener">In Google Maps öffnen ↗</a>'; }
  else { r+='<a class="go off">Mindestens 2 Parks wählen</a>'; }
  if(sel.length>0){ r+='<button class="clear" onclick="clearRoute()">Route leeren</button>'; }
  document.getElementById("route").innerHTML=r;

  // Parkliste oder Detailansicht – nie beides gleichzeitig
  const tools=document.querySelector(".tools");
  const header=document.querySelector("#side > header");
  const routeSection=document.querySelector("#side > .sec");
  let l="";
  if(activePark!==null){
    const i=activePark;
    // Detailansicht bekommt den gesamten Seitenbereich: Dashboard und Routenbox ausblenden.
    header.style.display="none";
    routeSection.style.display="none";
    tools.style.display="none";
    l='<div class="park-detail '+(isSeen(i)?"seen":"open")+'">'
      +'<div class="detail-head"><div><h2>'+escapeHtml(P[i][0])+'</h2><div class="meta">'+FLAG[P[i][1]]+' '+P[i][1]+'</div></div><button class="close-detail" aria-label="Zurück zur Parkliste" title="Zurück zur Parkliste" onclick="closeParkDetail()">×</button></div>'
      +'<div class="detail-actions"><button class="b'+(isSeen(i)?" on-seen":"")+'" onclick="toggleSeen('+i+')">✓ '+(isSeen(i)?"Besucht":"War da")+'</button>'
      +'<button class="b'+(sel.indexOf(i)>=0?" on-route":"")+'" onclick="toggleSel('+i+')">+ Route</button>'
      +'<a class="b" href="'+url(i)+'" target="_blank" rel="noopener">Offizielle Website ↗</a></div>'
      +trailHtml(i)+wHtml(i)+'</div>';
  }else{
    header.style.display="";
    routeSection.style.display="";
    tools.style.display="flex";
    for(let i=0;i<P.length;i++){
      if(!show(i)){ continue; }
      l+='<div class="item '+(isSeen(i)?"seen":"open")+'" onclick="focusPark('+i+')">'
        +'<div class="name">'+P[i][0]+"</div>"
        +'<div class="meta">'+FLAG[P[i][1]]+" "+P[i][1]+"</div>"
        +'<div class="btns" onclick="event.stopPropagation()">'
        +'<button class="b'+(isSeen(i)?" on-seen":"")+'" onclick="toggleSeen('+i+')">✓ war da</button>'
        +'<button class="b'+(sel.indexOf(i)>=0?" on-route":"")+'" onclick="toggleSel('+i+')">+ Route</button>'
        +'<a class="b" href="'+url(i)+'" target="_blank" rel="noopener">Website ↗</a>'
        +"</div></div>";
    }
    if(l===""){ l='<div class="sec sub">Nichts gefunden.</div>'; }
  }
  document.getElementById("list").innerHTML=l;
}

// Filter + Suche
document.querySelectorAll(".chip[data-f]").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll(".chip[data-f]").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    filter=b.getAttribute("data-f");
    draw();
  };
});
document.getElementById("q").oninput=function(e){ query=e.target.value.toLowerCase(); draw(); };

const themeBtn=document.getElementById('themeBtn');
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('gc_theme',t);themeBtn.textContent=t==='dark'?'Helles Design':'Dunkles Design';}
setTheme(localStorage.getItem('gc_theme')||'dark');
themeBtn.onclick=function(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');};

if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js");
}
draw();
map.fitBounds(L.latLngBounds(P.map(p=>[p[2],p[3]])),{padding:[30,30]});
if(sel.length>=2)calculateRoadRoute();
</script>
